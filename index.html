<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE.exe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="terminal">

        <div class="top-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">LOVE.exe</span>
        </div>

        <div class="content">

            <h1>MY FAVORITE PERSON</h1>

            <div id="terminal-text"></div>

            <div class="loading">
                <div id="progress"></div>
            </div>

            <p id="percentage">0%</p>

            <button id="enterBtn" onclick="enterSystem()">
                [ ENTRAR ]
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
